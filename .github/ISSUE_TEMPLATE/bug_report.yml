name: Bug report
description: Something in Nerdfader isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Which site?
      description: The page whose volume didn't change (or changed wrongly).
      placeholder: e.g. https://www.youtube.com/watch?v=...
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Arc 1.90 (Chromium 141), Chrome 141
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nerdfader version
      description: Shown at the top right of the popup.
      placeholder: e.g. v1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots, steps to reproduce)
