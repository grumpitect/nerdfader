name: Feature request
description: Suggest an idea or improvement for Nerdfader
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Nerdfader to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help you?
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (mockups, examples from other extensions)
